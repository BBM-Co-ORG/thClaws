overrides:
  '@xmldom/xmldom': ^0.8.15
  brace-expansion@1: ^1.1.16
  brace-expansion@5: ^5.0.8
  js-yaml@4: ^4.3.2
  postcss: ^8.5.18
  '@babel/core': ^7.29.6
  # Dependabot advisories on build-time transitives (vite/eslint chains).
  # Pinned as overrides rather than by bumping vite/eslint/tailwind wholesale,
  # which would churn the toolchain for a patch-level security fix.
  browserslist: ^4.28.7
  baseline-browser-mapping: ^2.11.0
  '@humanfs/node': ^0.16.8

onlyBuiltDependencies: []

# both are console-banner postinstalls (core-js: funding notice,
# es5-ext: peace message) — nothing to build, listed only to silence
# pnpm 10's approve-builds warning
ignoredBuiltDependencies:
  - core-js
  - es5-ext
